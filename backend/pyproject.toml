[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prime-ontology"
version = "1.0.0"
description = "Prime Ontology engine: Django app (ingestion, ontology model, validation, reasoning, query, governance, agent layer)."
requires-python = ">=3.10"
dependencies = [
  "Django>=4.2", "rdflib>=7.0", "PyMySQL>=1.1", "openpyxl>=3.1", "pyyaml>=6", "pypdf>=4",
  "python-docx>=1.1", "python-pptx>=1.0", "beautifulsoup4>=4.12", "owlrl>=6.0", "pyshacl>=0.26",
]

[tool.setuptools.packages.find]
include = ["prime_ontology*"]
